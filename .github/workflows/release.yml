name: Build Windows installer and publish release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test Windows application and installer
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Prepare versioned release files
        id: version
        shell: pwsh
        run: |
          $Version = (& .build-venv/Scripts/python.exe -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read version' }
          "version=$Version" >> $env:GITHUB_OUTPUT
          Copy-Item dist/beamic-pro-windows-portable.zip "dist/beamic-pro-$Version-windows-portable.zip"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item "dist/installer/beamic-pro-$Version-setup.exe" dist/release/
          Copy-Item "dist/beamic-pro-$Version-windows-portable.zip" dist/release/
          Copy-Item dist/plugins/*.zip dist/release/
          if (Test-Path dist/beamic-pro/docs) { throw 'Public package must not contain local documentation or reports' }
          @"
          beamic pro $Version 是通过 Ophir BeamMic 连接相机的中文光学实验助手。

          包含实时光斑定位与定圈、自动曝光、双镜合束、束腰测量、单镜等高与可选准直，以及 Python 插件支持。

          此版本改为新帧回调内复制完整数值快照，独立线程传输，不再依靠 UniqueKey 去重或证明一致性。预览缩图、原图定位；过期定位圈标注时间并在2秒后隐藏。增加暂停采集，以及默认关闭的本机诊断保存（默认5张，最多20张，保留原始数值精度）。

          连接时使用新版 device-profile.example.json，曝光预检报告可先取消。默认仍仅开放预览；实时来源、SDK回调和线程约定、逐帧曝光、线性量程及坐标信息仍需实机验证。软件快照计数不等于硬件新帧计数，预览圈不作为正式测量。诊断文件由用户手动保存在本机，不自动上传。

          下载 setup.exe 安装，或解压 windows-portable.zip 后运行 beamic-pro.exe。需要 Windows x64 和 .NET Framework 4.8；实机连接还需已授权的 BeamMic 与相机驱动。首次建立共享插件环境需要联网。

          安装包由 GitHub Actions 在 Windows 上运行自动化测试后构建。真实相机兼容性、实验精度和20有效帧/秒目标仍需实验室验收。

          公开版本仅包含源码和程序，不包含本地教程截图、图文报告或实验记录。
          "@ | Set-Content dist/release-notes.md -Encoding utf8
          Get-ChildItem dist/release -File | Sort-Object Name | ForEach-Object {
            $Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)"
          } | Set-Content dist/release/SHA256SUMS.txt -Encoding utf8
      - name: Keep build files for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: beamic-pro-windows-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          $Files = @(Get-ChildItem dist/release -File | ForEach-Object FullName)
          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag @Files --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $Tag @Files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "beamic pro $env:RELEASE_VERSION" --notes-file dist/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
