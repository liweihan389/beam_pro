name: Windows build and tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test and create portable Windows package
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/build_windows.ps1 -SkipInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: beamic-pro-windows
          path: |
            dist/beamic-pro-windows-portable.zip
            dist/plugins/*.zip

