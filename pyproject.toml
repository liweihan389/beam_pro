[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beamic-pro"
version = "0.5.0"
description = "BeamMic-connected optical alignment assistant"
requires-python = ">=3.12,<3.15"
dependencies = ["beamic-pro-sdk==2.1.0", "numpy>=1.26,<3", "scipy>=1.12,<2", "PySide6-Essentials>=6.7,<7", "packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "pyinstaller>=6", "matplotlib>=3.9,<4"]

[project.scripts]
beamic-pro = "beamic_pro.app:main"
beamic-preflight = "beamic_pro.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "sdk/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["E402"]

